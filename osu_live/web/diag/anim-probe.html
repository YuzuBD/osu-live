<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>page transition probe</title>
<style>
  body { margin: 0; background: #15151a; color: #ddd; font: 12px/1.5 ui-monospace, monospace; }
  iframe { width: 812px; height: 375px; border: 0; display: block; background: #000; }
  pre { margin: 0; padding: 10px 14px; white-space: pre-wrap; }
</style>
</head>
<body>
<iframe id="f" src="/?demo=home"></iframe>
<pre id="out">running…</pre>
<script>
/* Drives the overlay through real state changes inside an iframe and samples
 * what the browser computed, rather than what the source implies. Nothing is
 * injected into the app: this only calls the handle app.js already exposes
 * (window.osuLive) and reads styles back.
 *
 * Opacity alone cannot tell a rise from a descend, so the transform matrix is
 * sampled too -- its last component is the block's vertical offset. */
const f = document.getElementById('f');
const out = document.getElementById('out');
const lines = [];
const say = (s) => { lines.push(s); out.textContent = lines.join('\n'); };

const dy = (m) => {
  const n = /matrix\(([^)]+)\)/.exec(m);
  return n ? Number(n[1].split(',')[5]).toFixed(1) : m;
};

f.addEventListener('load', () => {
  const w = f.contentWindow;
  const d = f.contentDocument;
  if (!w.osuLive) { say('FAIL: window.osuLive is not exposed'); return; }
  say('MOTION inside the frame: ' + w.osuLive.MOTION);

  const settle = 200;
  const sample = (sel, label, done) => {
    const rows = [];
    const t0 = performance.now();
    let n = 0;
    const id = setInterval(() => {
      const el = d.querySelector(sel);
      const cs = getComputedStyle(el);
      rows.push({ t: Math.round(performance.now() - t0), o: Number(cs.opacity).toFixed(2), y: dy(cs.transform) });
      if (++n >= 24) { clearInterval(id); report(label, sel, rows); done(); }
    }, 16);
  };

  const report = (label, sel, rows) => {
    say('');
    say('── ' + label + '  (' + sel + ')');
    say('     ms    opacity   translateY');
    for (const r of rows) if (r.t <= 320) say('    ' + String(r.t).padStart(4) + '     ' + r.o.padStart(4) + '      ' + String(r.y).padStart(7));
    const first = Number(rows[0].o);
    const last = Number(rows[rows.length - 1].o);
    say('    first opacity ' + first + ' -> settled ' + last + ';  start offset ' + rows[0].y + 'px');
  };

  const phase1 = () => {
    w.osuLive.render(w.osuLive.demoState('select'));
    sample('.page-select .sel-left', 'forward: home -> select', () => setTimeout(phase2, settle));
  };
  const phase2 = () => {
    w.osuLive.render(w.osuLive.demoState('results'));
    setTimeout(() => {
      w.osuLive.render(w.osuLive.demoState('select'));
      sample('.page-select .sel-left', 'backward: results -> select', () => setTimeout(phase3, settle));
    }, settle);
  };
  /* The second block on a screen is meant to follow the first, not arrive with
   * it: same instant, two selectors, one of them delayed. */
  const phase3 = () => {
    w.osuLive.render(w.osuLive.demoState('home'));
    setTimeout(() => {
      w.osuLive.render(w.osuLive.demoState('select'));
      const t0 = performance.now();
      let n = 0;
      const rows = [];
      const id = setInterval(() => {
        const a = Number(getComputedStyle(d.querySelector('.page-select .sel-left')).opacity);
        const b = Number(getComputedStyle(d.querySelector('.page-select .sel-right > .stars')).opacity);
        rows.push({ t: Math.round(performance.now() - t0), a: a.toFixed(2), b: b.toFixed(2) });
        if (++n >= 20) {
          clearInterval(id);
          say('');
          say('── stagger: the first block against the second');
          say('     ms   sel-left  stars');
          for (const r of rows) if (r.t <= 260) say('    ' + String(r.t).padStart(4) + '     ' + r.a + '     ' + r.b);
          const lag = rows.findIndex((r) => Number(r.b) > 0.02) - rows.findIndex((r) => Number(r.a) > 0.02);
          say('    the second block starts ' + lag + ' samples after the first');
          say('');
          say('DONE');
        }
      }, 16);
    }, settle);
  };

  phase1();
});
</script>
</body>
</html>
